name: Kiem tra code

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            functions-xe-shop/package-lock.json
            functions-xac-nhan-email/package-lock.json
      - run: npm ci && npm test
        working-directory: functions
      - run: npm ci && npm test
        working-directory: functions-xe-shop
      - run: npm ci && node --check index.js
        working-directory: functions-xac-nhan-email

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: test-rules
      - run: >-
          npx --yes firebase-tools@15.35.0 emulators:exec
          --only firestore,storage --project demo-rules
          "node test-rules/tro_rules.test.mjs && node test-rules/quan_an_rules.test.mjs && node --test test-rules/xe_shop_rules.test.mjs"
